name: Build Android APK

# Триггеры: запуск вручную + при пуше тега
on:
  workflow_dispatch:        # кнопка "Run workflow" в UI
  push:
    tags:
      - 'v*-awg*'           # сборка при любом теге типа v1.13.8-awg2.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          local-cache: true

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Build libbox.aar with AWG support
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd clients/android
          mkdir -p app/libs
          gomobile bind -v \
            -androidapi 21 \
            -javapkg=io.nekohasekai \
            -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api,with_awg" \
            -trimpath -ldflags="-s -w -buildid=" \
            -target=android/arm64,android/arm,android/amd64 \
            -o ./app/libs/libbox.aar \
            ../../experimental/libbox
            
      - name: Grant gradlew permission
        run: chmod +x clients/android/gradlew

      - name: Build APK
        working-directory: clients/android
        run: ./gradlew assembleOtherRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sfa-awg-apk
          path: clients/android/app/build/outputs/apk/other/release/*.apk
          retention-days: 30
